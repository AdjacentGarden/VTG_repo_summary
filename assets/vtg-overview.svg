<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Find the moment. Video Temporal Grounding.</title>
<desc id="desc">A language query selects the interval from 12.4 to 18.7 seconds on a thirty-second video timeline.</desc>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c35"/><stop offset="1" stop-color="#0a1122"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#7562d6" stop-opacity=".26"/><stop offset="1" stop-color="#7562d6" stop-opacity="0"/></radialGradient>
<linearGradient id="mint"><stop stop-color="#49cdb3"/><stop offset="1" stop-color="#9af1d7"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6880ac" opacity=".18"/></pattern>
<symbol id="person" viewBox="0 0 70 72"><circle cx="28" cy="15" r="7" fill="#afbed6"/><path d="M28 28v23m0-16 19 6m-19 10-10 16m10-16 11 16" fill="none" stroke="#afbed6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="cup" viewBox="0 0 28 28"><path d="M6 9h13v12H6zM19 11h4v6h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
<symbol id="fridge" viewBox="0 0 32 70"><rect x="3" y="3" width="25" height="64" rx="3" fill="none" stroke="#7fd8c6" stroke-width="2.5"/><path d="M3 24h25m-5-13v6m0 17v12" stroke="#7fd8c6" stroke-width="2.5" stroke-linecap="round"/></symbol>
</defs>
<rect width="1200" height="440" rx="22" fill="url(#background)"/>
<rect x="556" y="0" width="644" height="440" rx="22" fill="url(#dots)"/>
<ellipse cx="892" cy="148" rx="420" ry="308" fill="url(#glow)"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect x="46" y="36" width="53" height="27" rx="7" fill="#9280ef" fill-opacity=".17" stroke="#9280ef" stroke-opacity=".5"/>
<text x="72" y="55" text-anchor="middle" fill="#b6a9ff" font-size="12" font-weight="700" letter-spacing="1.5">VTG</text>
<text x="113" y="54" fill="#92a6c4" font-size="10.5" letter-spacing="2.3">A RESEARCH COLLECTION</text>
<text x="46" y="139" font-size="57" fill="#f8faff" font-weight="750" letter-spacing="-2">Find the moment.</text>
<text x="49" y="181" font-size="23" fill="#96e9d2">Ground language in video time.</text>
<text x="49" y="217" font-size="14" fill="#9aadc9">Models, supervision, temporal evidence — connected.</text>
<rect x="47" y="263" width="453" height="112" rx="14" fill="#182740" stroke="#354662"/>
<rect x="64" y="281" width="70" height="19" rx="5" fill="#34534f"/>
<text x="99" y="295" text-anchor="middle" fill="#97efd4" font-size="9" font-weight="700" letter-spacing="1.5">QUERY</text>
<text x="65" y="326" fill="#e8effc" font-size="17">“The person puts down a cup,</text>
<text x="65" y="351" fill="#e8effc" font-size="17">then opens the refrigerator.”</text>
<path d="M519 319h42m-11-8 11 8-11 8" stroke="#96e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="600" y="93" fill="#9aadc9" font-size="10" letter-spacing="2">UNTRIMMED VIDEO</text>
<text x="1148" y="93" text-anchor="end" fill="#9aadc9" font-size="10">00:00 — 00:30</text>
<g fill="#1b2941" stroke="#354766">
<rect x="601" y="114" width="82" height="110" rx="9"/><rect x="693" y="114" width="82" height="110" rx="9"/>
<rect x="785" y="114" width="82" height="110" rx="9" stroke="#64ccb6"/><rect x="877" y="114" width="82" height="110" rx="9" stroke="#64ccb6"/>
<rect x="969" y="114" width="82" height="110" rx="9"/><rect x="1061" y="114" width="82" height="110" rx="9"/>
</g>
<g fill="#8fa4c4" font-size="9" text-anchor="middle">
<text x="642" y="134">01</text><text x="734" y="134">02</text><text x="826" y="134" fill="#9af1d7">03</text><text x="918" y="134" fill="#9af1d7">04</text><text x="1010" y="134">05</text><text x="1102" y="134">06</text>
</g>
