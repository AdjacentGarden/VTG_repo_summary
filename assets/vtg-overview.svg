<text x="1132" y="308" text-anchor="end" fill="#8fa4c4" font-size="10">30 s</text>
<rect x="788" y="326" width="180" height="45" rx="10" fill="#193b3b" stroke="#5fcdb5" stroke-opacity=".6"/>
<text x="878" y="354" text-anchor="middle" fill="#a4f4dc" font-size="19" font-weight="650">[12.4, 18.7] s</text>
<text x="878" y="399" text-anchor="middle" fill="#8fa4c4" font-size="10" letter-spacing="1.8">LOCALIZE THE SUPPORTING EVIDENCE</text>
<text x="48" y="410" fill="#7891b4" font-size="10" letter-spacing="2">PAPERS / DATASETS / CODE / READING NOTES</text>
