<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Video Temporal Grounding</title>
<desc id="desc">A natural-language query selects an interval from 12.4 to 18.7 seconds on a video timeline. The diagram is illustrative.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1630"/><stop offset="1" stop-color="#182a45"/></linearGradient>
  <linearGradient id="span" x2="1"><stop stop-color="#56dec0"/><stop offset="1" stop-color="#91eccf"/></linearGradient>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="56" y="61" font-size="13" fill="#84b6d0" letter-spacing="3">LANGUAGE × VIDEO × TIME</text>
<text x="56" y="109" font-size="38" font-weight="700" fill="#fff">Video Temporal Grounding</text>
<text x="56" y="141" font-size="17" fill="#c7d6e9">From a language query to precise temporal evidence.</text>
<rect x="56" y="180" width="342" height="113" rx="13" fill="#253b58" stroke="#395471"/>
<text x="77" y="209" font-size="12" fill="#91eccf" letter-spacing="2">QUERY</text>
<text x="77" y="237" font-size="16" fill="#fff">“The person puts down a cup,</text>
<text x="77" y="262" font-size="16" fill="#fff">then opens the refrigerator.”</text>
<path d="M419 237H465M453 229l12 8-12 8" fill="none" stroke="#91eccf" stroke-width="3"/>
<g fill="#294561" stroke="#3f6380">
<rect x="491" y="183" width="89" height="64" rx="8"/><rect x="588" y="183" width="89" height="64" rx="8"/>
<rect x="685" y="183" width="89" height="64" rx="8"/><rect x="782" y="183" width="89" height="64" rx="8"/>
<rect x="879" y="183" width="89" height="64" rx="8"/><rect x="976" y="183" width="89" height="64" rx="8"/>
</g>
<g fill="#84b6d0" font-size="13" text-anchor="middle">
<text x="536" y="221">frame 01</text><text x="633" y="221">frame 02</text><text x="730" y="221">frame 03</text>
<text x="827" y="221">frame 04</text><text x="924" y="221">frame 05</text><text x="1021" y="221">frame 06</text>
</g>
<rect x="491" y="263" width="574" height="11" rx="5" fill="#3e5671"/>
<rect x="728" y="258" width="121" height="21" rx="6" fill="url(#span)"/>
<path d="M728 250V292M849 250V292" stroke="#91eccf" stroke-width="2"/>
<g font-size="13" fill="#c7d6e9"><text x="491" y="299">0 s</text><text x="1025" y="299">30 s</text></g>
<text x="788" y="312" text-anchor="middle" font-size="17" fill="#91eccf" font-weight="600">[12.4, 18.7] s</text>
<text x="56" y="333" font-size="12" fill="#84b6d0">PAPERS · DATASETS · CODE · METRICS · READING NOTES</text>
</g>
</svg>
